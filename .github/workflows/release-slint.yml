name: Release ImPlay-Slint

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. 1.6.0). Must be X.Y.Z so the app version is picked up."
        required: true
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-slint-${{ github.ref }}
  cancel-in-progress: false

env:
  PRESET: x64-clang-release
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-windows:
    name: Build (Windows x64, clang-cl, Slint)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GetGitVersion.cmake runs `git describe --tags`, so full history and tags are needed
          fetch-depth: 0

      - name: Validate and create tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ("$env:RELEASE_TAG" -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Tag '$env:RELEASE_TAG' must look like X.Y.Z"
          }
          if (git tag --list "$env:RELEASE_TAG") {
            throw "Tag '$env:RELEASE_TAG' already exists"
          }
          # Local tag so the build embeds the right version; the release step pushes it
          git tag "$env:RELEASE_TAG"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Rust (needed to build Slint)
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure LLVM and Ninja are available
        shell: pwsh
        run: |
          if (-not (Test-Path "C:/Program Files/LLVM/bin/clang-cl.exe")) {
            choco install llvm -y --no-progress
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          & "C:/Program Files/LLVM/bin/clang-cl.exe" --version
          ninja --version
          cmake --version

      - name: Configure
        run: cmake --preset ${{ env.PRESET }}

      - name: Build
        run: cmake --build --preset ${{ env.PRESET }}

      - name: Fetch bundled extras
        shell: pwsh
        run: |
          # Extras the upstream CPack package shipped (see cmake/CreateCpackPackage.cmake), minus
          # ANGLE's libEGL/libGLESv2: Slint renders through WGL, and window.cpp prefers a bundled
          # libGLESv2.dll, which then fails with "Unable to load the OpenGL ES functions".
          # The mpv build only supplies mpv.com (console launcher, renamed ImPlay.com) and the
          # manual, so it doesn't need to match the libmpv version in the dev archive.
          $extras = @(
            @{ File = "mpv.7z"
               Url  = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260924/mpv-x86_64-20260924-git-2a4eb8067c.7z"
               Hash = "0d39c18086f9df02fbd087b18c8b30e7e328a79481bce83e57f86ab70d0e53bf" }
          )
          New-Item -ItemType Directory -Force extras | Out-Null
          foreach ($e in $extras) {
            $out = "extras/$($e.File)"
            curl.exe -sSfL --retry 3 -o $out $e.Url
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $($e.Url)" }
            $actual = (Get-FileHash $out -Algorithm SHA256).Hash
            if ($actual -ne $e.Hash) { throw "SHA256 mismatch for $($e.File): $actual" }
          }
          7z x extras/mpv.7z mpv.com doc -oextras/mpv -y
          if ($LASTEXITCODE -ne 0) { throw "Extracting mpv.7z failed" }

          # yt-dlp goes stale quickly as sites change, so always bundle the newest release and
          # verify it against the SHA2-256SUMS file published with that same release.
          $release = Invoke-RestMethod "https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest" `
            -Headers @{ Authorization = "Bearer ${{ github.token }}" }
          $base = "https://github.com/yt-dlp/yt-dlp/releases/download/$($release.tag_name)"
          curl.exe -sSfL --retry 3 -o extras/yt-dlp.exe "$base/yt-dlp.exe"
          if ($LASTEXITCODE -ne 0) { throw "Download failed: $base/yt-dlp.exe" }
          $sums = (curl.exe -sSfL --retry 3 "$base/SHA2-256SUMS") -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "Download failed: $base/SHA2-256SUMS" }
          $expected = $sums -split "`n" |
            ForEach-Object { if ($_ -match '^([0-9a-f]{64})\s+yt-dlp\.exe$') { $Matches[1] } } |
            Select-Object -First 1
          if (-not $expected) { throw "yt-dlp.exe not listed in SHA2-256SUMS" }
          $actual = (Get-FileHash extras/yt-dlp.exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "SHA256 mismatch for yt-dlp.exe: $actual" }
          Write-Host "Bundling yt-dlp $($release.tag_name)"

          # yt-dlp needs a JavaScript runtime for full YouTube support. It finds deno.exe placed
          # next to yt-dlp.exe even when Deno isn't on PATH, so bundle the newest release too.
          $release = Invoke-RestMethod "https://api.github.com/repos/denoland/deno/releases/latest" `
            -Headers @{ Authorization = "Bearer ${{ github.token }}" }
          $asset = "deno-x86_64-pc-windows-msvc.zip"
          $base = "https://github.com/denoland/deno/releases/download/$($release.tag_name)"
          curl.exe -sSfL --retry 3 -o "extras/$asset" "$base/$asset"
          if ($LASTEXITCODE -ne 0) { throw "Download failed: $base/$asset" }
          # The .sha256sum file is Get-FileHash output: a "Hash : <HEX>" line among others
          $sums = (curl.exe -sSfL --retry 3 "$base/$asset.sha256sum") -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "Download failed: $base/$asset.sha256sum" }
          $expected = $sums -split "`n" |
            ForEach-Object { if ($_ -match '^\s*Hash\s*:\s*([0-9A-Fa-f]{64})\s*$') { $Matches[1] } } |
            Select-Object -First 1
          if (-not $expected) { throw "No hash found in $asset.sha256sum" }
          $actual = (Get-FileHash "extras/$asset" -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "SHA256 mismatch for ${asset}: $actual" }
          7z e "extras/$asset" deno.exe -oextras -y
          if ($LASTEXITCODE -ne 0) { throw "Extracting $asset failed" }
          Write-Host "Bundling Deno $($release.tag_name)"

      - name: Package
        id: package
        shell: pwsh
        run: |
          $buildDir = "out/build/$env:PRESET"
          $name = "ImPlay-Slint-$env:RELEASE_TAG-win64"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force $stage | Out-Null

          Copy-Item "$buildDir/ImPlay.exe" $stage
          # fmt.dll, slint_cpp.dll, libmpv-2.dll, ...
          Copy-Item "$buildDir/*.dll" $stage
          Copy-Item extras/mpv/mpv.com "$stage/ImPlay.com"
          Copy-Item extras/mpv/doc "$stage/doc" -Recurse
          Copy-Item extras/yt-dlp.exe, extras/deno.exe $stage
          Copy-Item LICENSE.txt, CREDITS.md $stage
          Copy-Item ui/VAYOU-LICENSE $stage

          Get-ChildItem $stage | Format-Table Name, Length

          $zip = "dist/$name.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          "stage=$stage" >> $env:GITHUB_OUTPUT

      - name: Build installer
        id: installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $name = "${{ steps.package.outputs.name }}-setup"
          $stage = (Resolve-Path "${{ steps.package.outputs.stage }}").Path
          $outDir = (Resolve-Path dist).Path
          & $iscc /Q "/DAppVersion=$env:RELEASE_TAG" "/DSourceDir=$stage" "/DOutputDir=$outDir" "/DOutputName=$name" resources/win32/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          "exe=dist/$name.exe" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.installer.outputs.exe }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ImPlay-Slint ${{ env.RELEASE_TAG }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          generate_release_notes: true
          files: |
            ${{ steps.installer.outputs.exe }}
            ${{ steps.package.outputs.zip }}
